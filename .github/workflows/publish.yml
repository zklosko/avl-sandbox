name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # NEW — required for npm's OIDC trusted-publishing flow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g npm@latest # NEW — trusted publishing needs npm CLI 11.5.1+

      - run: npm ci

      - name: Publish to npm
        run: npm publish --access public
